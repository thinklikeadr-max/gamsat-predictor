<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>The GAMSAT Intensive</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  font-family:'Montserrat',sans-serif;

  background:

  radial-gradient(circle at top left,
  rgba(65,240,207,0.16) 0%,
  transparent 28%),

  radial-gradient(circle at top right,
  rgba(125,208,255,0.14) 0%,
  transparent 30%),

  radial-gradient(circle at bottom left,
  rgba(65,240,207,0.08) 0%,
  transparent 30%),

  linear-gradient(
  180deg,
  #13283d 0%,
  #102132 40%,
  #0b1724 100%
  );

  min-height:100vh;

  color:#eef6ff;

  overflow-x:hidden;
}

.page-wrapper{

  width:100%;
  min-height:100vh;

  display:flex;

  justify-content:center;
  align-items:center;

  padding:40px 20px;
}

.container{

  width:100%;
  max-width:1100px;

  background:
  linear-gradient(
  180deg,
  rgba(14,28,44,0.82),
  rgba(10,22,35,0.88)
  );

  border:
  1px solid rgba(65,240,207,0.12);

  border-radius:34px;

  padding:55px;

  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);

  box-shadow:
  0 0 40px rgba(0,0,0,0.22),
  0 0 24px rgba(65,240,207,0.05);

  position:relative;

  overflow:hidden;
}

.container::before{

  content:"";

  position:absolute;

  top:-120px;
  right:-120px;

  width:280px;
  height:280px;

  background:
  rgba(65,240,207,0.06);

  filter:blur(70px);

  border-radius:50%;
}

.container::after{

  content:"";

  position:absolute;

  bottom:-140px;
  left:-120px;

  width:260px;
  height:260px;

  background:
  rgba(125,208,255,0.06);

  filter:blur(75px);

  border-radius:50%;
}

.content{
  position:relative;
  z-index:2;
}

.hidden{
  display:none;
}

.logo{

  width:100%;
  max-width:820px;

  display:block;

  margin:0 auto 20px auto;
}

.hero-subtitle{

  max-width:760px;

  margin:0 auto 46px auto;

  text-align:center;

  color:#d8e7f4;

  font-size:1.08rem;

  line-height:1.9;
}

.primary-btn{

  width:100%;
  max-width:420px;

  margin:auto;

  display:block;

  padding:20px;

  border:none;

  border-radius:20px;

  font-family:'Sora',sans-serif;

  font-size:1rem;

  font-weight:700;

  cursor:pointer;

  color:#082028;

  background:
  linear-gradient(
  90deg,
  #35d6bc,
  #41f0cf
  );

  transition:0.2s ease;

  box-shadow:
  0 0 18px rgba(65,240,207,0.18);
}

.primary-btn:hover{

  transform:
  translateY(-2px);

}

.progress-container{

  width:100%;

  height:14px;

  background:#1b3044;

  border-radius:999px;

  overflow:hidden;

  margin-bottom:16px;
}

.progress-bar{

  height:100%;
  width:0%;

  border-radius:999px;

  background:
  linear-gradient(
  90deg,
  #35d6bc,
  #7cc8ff
  );

  transition:0.25s ease;
}

.progress-text{

  color:#9db4c8;

  font-size:0.92rem;

  margin-bottom:18px;
}

.back-btn{

  background:none;

  border:none;

  color:#8fd0ff;

  font-family:'Montserrat',sans-serif;

  font-size:0.95rem;

  font-weight:600;

  cursor:pointer;

  margin-bottom:28px;

  transition:0.2s ease;
}

.question{

  font-family:'Sora',sans-serif;

  font-size:1.9rem;

  font-weight:700;

  line-height:1.5;

  margin-bottom:35px;

  color:#f3fbff;
}

.answers{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:18px;
}

.answer-btn{

  min-height:110px;

  border:none;

  border-radius:24px;

  padding:25px;

  cursor:pointer;

  color:white;

  font-family:'Montserrat',sans-serif;

  font-size:1rem;

  font-weight:600;

  text-align:left;

  background:
  linear-gradient(
  145deg,
  rgba(41,75,102,0.68),
  rgba(20,39,58,0.96)
  );

  border:
  1px solid rgba(65,240,207,0.10);

  transition:0.15s ease;
}

.answer-btn:hover{

  background:
  linear-gradient(
  145deg,
  rgba(55,103,138,0.88),
  rgba(27,52,74,1)
  );

  border:
  1px solid rgba(65,240,207,0.22);

  box-shadow:
  0 0 14px rgba(65,240,207,0.10);
}

.input-section{
  max-width:560px;
  margin:auto;
}

.input-section h2{

  font-family:'Sora',sans-serif;

  font-size:2rem;

  margin-bottom:28px;

  text-align:center;
}

input{

  width:100%;

  padding:20px;

  margin-bottom:18px;

  border-radius:18px;

  border:
  1px solid rgba(65,240,207,0.14);

  background:
  rgba(255,255,255,0.05);

  color:white;

  font-size:1rem;

  font-family:'Montserrat',sans-serif;
}

input::placeholder{
  color:#9ab0c2;
}

.results-title{

  text-align:center;

  font-family:'Sora',sans-serif;

  font-size:2.8rem;

  font-weight:800;

  margin-bottom:30px;
}

.result-card{

  background:
  linear-gradient(
  180deg,
  rgba(255,255,255,0.04),
  rgba(255,255,255,0.02)
  );

  border:
  1px solid rgba(65,240,207,0.10);

  border-radius:28px;

  padding:35px;

  margin-bottom:24px;
}

.result-label{

  color:#8fd9d0;

  margin-bottom:12px;

  font-weight:600;
}

.score{

  font-family:'Sora',sans-serif;

  font-size:4rem;

  font-weight:800;

  background:
  linear-gradient(
  90deg,
  #41f0cf,
  #8fd0ff
  );

  -webkit-background-clip:text;

  -webkit-text-fill-color:transparent;
}

.projected{

  margin-top:16px;

  color:#d8e7f4;

  font-size:1.05rem;

  line-height:1.8;
}

.result-card h3{

  font-family:'Sora',sans-serif;

  margin-bottom:18px;

  font-size:1.5rem;

  color:#f3fbff;
}

ul{
  padding-left:20px;
  color:#d7e5f3;
}

li{
  margin-bottom:12px;
  line-height:1.7;
}

/* MOBILE OPTIMISATION */

@media(max-width:768px){

body{

background:
linear-gradient(
180deg,
#13283d 0%,
#102132 45%,
#0b1724 100%
);

}

.container::before,
.container::after{

display:none;

}

.container{

padding:28px;

backdrop-filter:none;
-webkit-backdrop-filter:none;

box-shadow:
0 0 24px rgba(0,0,0,0.16);

}

.question{
font-size:1.35rem;
}

.answers{
grid-template-columns:1fr;
}

.answer-btn{

min-height:88px;

padding:20px;

font-size:0.96rem;

}

.answer-btn:hover{

transform:none;

box-shadow:none;

}

.primary-btn:hover{

transform:none;

}

.results-title{
font-size:2.2rem;
}

.score{
font-size:3rem;
}

.hero-subtitle{
font-size:1rem;
line-height:1.7;
}

}

</style>
</head>

<body>

<div class="page-wrapper">

<div class="container">

<div class="content">

<div id="landing">

<img src="./logo.png" class="logo">

<p class="hero-subtitle">
Answer a short series of questions to estimate your current
GAMSAT performance and pinpoint what's holding your score back.
</p>

<button class="primary-btn" onclick="startQuiz()">
Calculate Now
</button>

</div>

<!-- KEEP THE REST OF YOUR EXISTING HTML + JAVASCRIPT EXACTLY THE SAME -->

</div>

</div>

</div>

</body>
</html>
