<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>The GAMSAT Intensive</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  font-family:'Montserrat',sans-serif;

  background:

  radial-gradient(circle at top left,
  rgba(65,240,207,0.12) 0%,
  transparent 26%),

  radial-gradient(circle at top right,
  rgba(125,208,255,0.10) 0%,
  transparent 28%),

  linear-gradient(
  180deg,
  #13283d 0%,
  #102132 45%,
  #0b1724 100%
  );

  min-height:100vh;

  color:#eef6ff;

  overflow-x:hidden;
}

.page-wrapper{

  width:100%;
  min-height:100vh;

  display:flex;

  justify-content:center;
  align-items:center;

  padding:30px 18px;
}

.container{

  width:100%;
  max-width:1100px;

  background:
  linear-gradient(
  180deg,
  rgba(16,30,46,0.92),
  rgba(11,23,36,0.96)
  );

  border:
  1px solid rgba(65,240,207,0.10);

  border-radius:30px;

  padding:48px;

  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);

  box-shadow:
  0 0 32px rgba(0,0,0,0.20);

  position:relative;

  overflow:hidden;
}

.content{
  position:relative;
  z-index:2;
}

.hidden{
  display:none;
}

.logo{

  width:100%;
  max-width:760px;

  display:block;

  margin:0 auto 22px auto;
}

.hero-subtitle{

  max-width:720px;

  margin:0 auto 42px auto;

  text-align:center;

  color:#d8e7f4;

  font-size:1.02rem;

  line-height:1.8;
}

.primary-btn{

  width:100%;
  max-width:420px;

  margin:auto;

  display:block;

  padding:18px;

  border:none;

  border-radius:18px;

  font-family:'Sora',sans-serif;

  font-size:1rem;

  font-weight:700;

  cursor:pointer;

  color:#082028;

  background:
  linear-gradient(
  90deg,
  #35d6bc,
  #41f0cf
  );

  transition:0.18s ease;

  box-shadow:
  0 0 16px rgba(65,240,207,0.16);
}

.primary-btn:hover{

  opacity:0.96;
}

.progress-container{

  width:100%;

  height:12px;

  background:#1b3044;

  border-radius:999px;

  overflow:hidden;

  margin-bottom:14px;
}

.progress-bar{

  height:100%;
  width:0%;

  border-radius:999px;

  background:
  linear-gradient(
  90deg,
  #35d6bc,
  #7cc8ff
  );

  transition:0.22s ease;
}

.progress-text{

  color:#9db4c8;

  font-size:0.9rem;

  margin-bottom:16px;
}

.back-btn{

  background:none;

  border:none;

  color:#8fd0ff;

  font-family:'Montserrat',sans-serif;

  font-size:0.95rem;

  font-weight:600;

  cursor:pointer;

  margin-bottom:26px;
}

.question{

  font-family:'Sora',sans-serif;

  font-size:1.8rem;

  font-weight:700;

  line-height:1.45;

  margin-bottom:32px;

  color:#f3fbff;
}

.answers{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:16px;
}

.answer-btn{

  min-height:100px;

  border:none;

  border-radius:22px;

  padding:24px;

  cursor:pointer;

  color:white;

  font-family:'Montserrat',sans-serif;

  font-size:1rem;

  font-weight:600;

  text-align:left;

  background:
  linear-gradient(
  145deg,
  rgba(41,75,102,0.74),
  rgba(20,39,58,0.96)
  );

  border:
  1px solid rgba(65,240,207,0.10);

  transition:0.14s ease;
}

.answer-btn:hover{

  background:
  linear-gradient(
  145deg,
  rgba(55,103,138,0.88),
  rgba(27,52,74,1)
  );

  border:
  1px solid rgba(65,240,207,0.18);

  box-shadow:
  0 0 10px rgba(65,240,207,0.08);
}

.input-section{
  max-width:560px;
  margin:auto;
}

.input-section h2{

  font-family:'Sora',sans-serif;

  font-size:2rem;

  margin-bottom:28px;

  text-align:center;
}

input{

  width:100%;

  padding:18px;

  margin-bottom:18px;

  border-radius:18px;

  border:
  1px solid rgba(65,240,207,0.12);

  background:
  rgba(255,255,255,0.05);

  color:white;

  font-size:1rem;

  font-family:'Montserrat',sans-serif;
}

input::placeholder{
  color:#9ab0c2;
}

.results-title{

  text-align:center;

  font-family:'Sora',sans-serif;

  font-size:2.6rem;

  font-weight:800;

  margin-bottom:28px;
}

.result-card{

  background:
  linear-gradient(
  180deg,
  rgba(255,255,255,0.03),
  rgba(255,255,255,0.015)
  );

  border:
  1px solid rgba(65,240,207,0.08);

  border-radius:26px;

  padding:32px;

  margin-bottom:22px;
}

.result-label{

  color:#8fd9d0;

  margin-bottom:12px;

  font-weight:600;
}

.score{

  font-family:'Sora',sans-serif;

  font-size:4rem;

  font-weight:800;

  background:
  linear-gradient(
  90deg,
  #41f0cf,
  #8fd0ff
  );

  -webkit-background-clip:text;

  -webkit-text-fill-color:transparent;
}

.projected{

  margin-top:16px;

  color:#d8e7f4;

  font-size:1.05rem;

  line-height:1.8;
}

.result-card h3{

  font-family:'Sora',sans-serif;

  margin-bottom:18px;

  font-size:1.45rem;

  color:#f3fbff;
}

ul{
  padding-left:20px;
  color:#d7e5f3;
}

li{
  margin-bottom:12px;
  line-height:1.7;
}

/* MOBILE */

@media(max-width:768px){

body{

background:
linear-gradient(
180deg,
#13283d 0%,
#102132 45%,
#0b1724 100%
);

}

.container{

padding:26px;

backdrop-filter:none;
-webkit-backdrop-filter:none;

border-radius:26px;

}

.question{

font-size:1.32rem;

line-height:1.5;

}

.answers{
grid-template-columns:1fr;
gap:14px;
}

.answer-btn{

min-height:84px;

padding:20px;

font-size:0.96rem;

}

.answer-btn:hover{

transform:none;
box-shadow:none;

}

.primary-btn:hover{

transform:none;

}

.results-title{
font-size:2rem;
}

.score{
font-size:2.8rem;
}

.hero-subtitle{

font-size:0.96rem;

line-height:1.7;

}

.logo{
max-width:100%;
}

}

</style>
</head>

<body>

<div class="page-wrapper">

<div class="container">

<div class="content">

<!-- LANDING -->

<div id="landing">

<img src="./logo.png" class="logo">

<p class="hero-subtitle">
Answer a short series of questions to estimate your current
GAMSAT performance and pinpoint what's holding your score back.
</p>

<button class="primary-btn" onclick="startQuiz()">
Calculate Now
</button>

</div>

<!-- QUIZ -->

<div id="quiz" class="hidden">

<div class="progress-container">
<div class="progress-bar" id="progressBar"></div>
</div>

<p class="progress-text" id="progressText">
0% Complete
</p>

<button class="back-btn" onclick="goBack()">
← Back
</button>

<h2 class="question" id="question"></h2>

<div class="answers" id="answers"></div>

</div>

<!-- EMAIL -->

<div id="emailSection" class="hidden">

<div class="input-section">

<h2>Enter your details to view your results</h2>

<input type="text" id="name" placeholder="First Name"/>

<input type="email" id="email" placeholder="Email Address"/>

<button class="primary-btn" onclick="submitDetails()">
See My Results
</button>

</div>

</div>

<!-- RESULTS -->

<div id="results" class="hidden">

<h1 class="results-title">
Your Estimated Outcome
</h1>

<div class="result-card">

<p class="result-label">
Estimated Current Range
</p>

<div class="score" id="estimatedScore"></div>

<p class="projected" id="projectedText"></p>

</div>

<div class="result-card">

<h3>
Key Areas Limiting Your Score
</h3>

<ul id="weaknessList"></ul>

</div>

<button class="primary-btn">
Apply for Bootcamp
</button>

</div>

</div>

</div>

</div>

<script>

const questions = [

{
text:"Degree Background",
answers:[
{text:"Biomedical / Medicine"},
{text:"Science"},
{text:"Engineering / Maths"},
{text:"Non-science"}
]
},

{
text:"Chemistry Level Completed",
answers:[
{text:"University Degree"},
{text:"A-Level"},
{text:"GCSE"},
{text:"Never studied"}
]
},

{
text:"Physics Level Completed",
answers:[
{text:"University Degree"},
{text:"A-Level"},
{text:"GCSE"},
{text:"Never studied"}
]
},

{
text:"Biology Level Completed",
answers:[
{text:"University Degree"},
{text:"A-Level"},
{text:"GCSE"},
{text:"Never studied"}
]
},

{
text:"Essay Writing Experience",
answers:[
{text:"Humanities / Essay-Based Degree"},
{text:"Essay-Based A-Level"},
{text:"No Experience"}
]
},

{
text:"Have you sat the GAMSAT before?",
answers:[
{text:"Yes"},
{text:"No"}
]
},

{
text:"What was your previous GAMSAT score?",
condition:"Yes",
answers:[
{text:"Below 50"},
{text:"50–55"},
{text:"56–60"},
{text:"60+"}
]
},

{
text:"How many official ACER GAMSAT mocks have you completed?",
answers:[
{text:"0"},
{text:"1–2"},
{text:"3–5"},
{text:"6+"}
]
},

{
text:"What is your average ACER mock score?",
condition:["1–2","3–5","6+"],
answers:[
{text:"Below 50"},
{text:"50–55"},
{text:"56–60"},
{text:"61+"}
]
},

{
text:"What's your estimated score range from other resources?",
condition:["0"],
answers:[
{text:"Below 50"},
{text:"50–54"},
{text:"55–59"},
{text:"60–64"},
{text:"65+"}
]
},

{
text:"Which section do you find the most difficult?",
answers:[
{text:"Section 1"},
{text:"Section 2"},
{text:"Section 3"},
{text:"Unsure / varies"}
]
},

{
text:"Study Hours Per Week",
answers:[
{text:"0–2"},
{text:"3–5"},
{text:"6–10"},
{text:"10+"}
]
},

{
text:"Preparation Duration",
answers:[
{text:"<1 month"},
{text:"1–3 months"},
{text:"3–6 months"},
{text:"6+ months"}
]
},

{
text:"How often do you review mistakes after a practice session?",
answers:[
{text:"Always"},
{text:"Often"},
{text:"Sometimes"},
{text:"Rarely"}
]
},

{
text:"How thoroughly do you analyse each mistake?",
answers:[
{text:"Always find root cause"},
{text:"Usually look into it"},
{text:"Read explanation only"},
{text:"Just note the answer"}
]
},

{
text:"How often do you practice under timed conditions?",
answers:[
{text:"Always"},
{text:"Sometimes"},
{text:"Rarely"},
{text:"Never"}
]
},

{
text:"How do you practice Section 2 essays?",
answers:[
{text:"Timed + professionally marked"},
{text:"Timed + self-reviewed"},
{text:"Timed, never reviewed"},
{text:"Untimed or never practiced"}
]
},

{
text:"How is your GAMSAT study organised?",
answers:[
{text:"Written weekly plan"},
{text:"General plan but changes day to day"},
{text:"Study when I can"},
{text:"No plan at all"}
]
},

{
text:"Biggest Difficulty",
answers:[
{text:"Timing"},
{text:"Understanding"},
{text:"Knowledge gaps"},
{text:"Essay structure"}
]
},

{
text:"How confident do you feel about sitting the GAMSAT right now?",
answers:[
{text:"Ready to sit it today"},
{text:"Nearly there - a few gaps"},
{text:"Not there yet - significant gaps"},
{text:"Far from ready"}
]
},

{
text:"Previous Tutoring",
answers:[
{text:"Yes"},
{text:"No"}
]
},

{
text:"What GAMSAT score are you aiming for?",
answers:[
{text:"70+"},
{text:"65–70"},
{text:"60–65"},
{text:"I'm not sure yet"}
]
}

];

let currentQuestion = 0;
let userAnswers = [];

function startQuiz(){

document.getElementById("landing").classList.add("hidden");
document.getElementById("quiz").classList.remove("hidden");

showQuestion();

}

function getVisibleQuestions(){

return questions.filter(q=>{

if(!q.condition) return true;

if(Array.isArray(q.condition)){
return q.condition.some(answer =>
userAnswers.includes(answer)
);
}

return userAnswers.includes(q.condition);

});

}

function showQuestion(){

const visibleQuestions = getVisibleQuestions();

const question = visibleQuestions[currentQuestion];

document.getElementById("question").innerText = question.text;

const progress =
(currentQuestion / visibleQuestions.length) * 100;

document.getElementById("progressBar").style.width =
progress + "%";

document.getElementById("progressText").innerText =
Math.round(progress) + "% Complete";

const answersDiv =
document.getElementById("answers");

answersDiv.innerHTML = "";

question.answers.forEach(answer=>{

const button =
document.createElement("button");

button.classList.add("answer-btn");

button.innerText = answer.text;

button.onclick = ()=>{
nextQuestion(answer);
};

answersDiv.appendChild(button);

});

}

function nextQuestion(answer){

userAnswers.push(answer.text);

currentQuestion++;

const visibleQuestions =
getVisibleQuestions();

if(currentQuestion < visibleQuestions.length){

showQuestion();

}else{

document.getElementById("quiz")
.classList.add("hidden");

document.getElementById("emailSection")
.classList.remove("hidden");

}

}

function goBack(){

if(currentQuestion === 0) return;

currentQuestion--;

userAnswers.pop();

showQuestion();

}

function calculateEstimatedScore(){

let score = 45;

if(userAnswers.includes("Biomedical / Medicine")) score += 2.5;
if(userAnswers.includes("Science")) score += 1.5;
if(userAnswers.includes("Engineering / Maths")) score += 1;

if(userAnswers.includes("Humanities / Essay-Based Degree")) score += 2;
if(userAnswers.includes("Essay-Based A-Level")) score += 1;

if(userAnswers.includes("50–55")) score += 1;
if(userAnswers.includes("56–60")) score += 2;
if(userAnswers.includes("60+")) score += 3;

if(userAnswers.includes("1–2")) score += 0.7;
if(userAnswers.includes("3–5")) score += 1.5;
if(userAnswers.includes("6+")) score += 2.5;

if(userAnswers.includes("50–54")) score += 1;
if(userAnswers.includes("55–59")) score += 2;
if(userAnswers.includes("60–64")) score += 3;
if(userAnswers.includes("65+")) score += 4;

if(userAnswers.includes("61+")) score += 3;

if(userAnswers.includes("6–10")) score += 1;
if(userAnswers.includes("10+")) score += 2;

if(userAnswers.includes("3–6 months")) score += 1;
if(userAnswers.includes("6+ months")) score += 2;

if(userAnswers.includes("Always")) score += 1.5;
if(userAnswers.includes("Often")) score += 1;

if(userAnswers.includes("Always find root cause")) score += 1.5;

if(userAnswers.includes("Timed + professionally marked")) score += 2;
if(userAnswers.includes("Timed + self-reviewed")) score += 1;

if(userAnswers.includes("Written weekly plan")) score += 2;

if(userAnswers.includes("Ready to sit it today")) score += 1.5;

if(score > 56){
score = 56;
}

return Math.round(score);

}

function getEstimatedRange(score){

if(score <= 46) return "45–47";
if(score <= 49) return "48–50";
if(score <= 52) return "51–53";
if(score <= 54) return "53–55";

return "55–57";

}

function getProjectedRange(score){

if(score <= 46) return "60–62";
if(score <= 49) return "61–63";
if(score <= 52) return "62–64";
if(score <= 54) return "63–65";

return "64–66";

}

async function submitDetails(){

const name =
document.getElementById("name").value;

const email =
document.getElementById("email").value;

if(!name || !email){

alert("Please complete your details.");
return;

}

const estimatedScore =
calculateEstimatedScore();

const payload = {

name:name,
email:email,
estimatedScore:estimatedScore,
estimatedRange:getEstimatedRange(estimatedScore),
projectedRange:getProjectedRange(estimatedScore),
answers:userAnswers

};

await fetch("https://formspree.io/f/xaqvqvkb",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(payload)

});

showResults();

}

function showResults(){

document.getElementById("emailSection")
.classList.add("hidden");

document.getElementById("results")
.classList.remove("hidden");

const estimatedScore =
calculateEstimatedScore();

const estimatedRange =
getEstimatedRange(estimatedScore);

const projectedRange =
getProjectedRange(estimatedScore);

document.getElementById("estimatedScore")
.innerText = estimatedRange;

document.getElementById("projectedText")
.innerHTML =
`
Current estimated score:
<strong>${estimatedScore}</strong>

<br><br>

Projected outcome with structured guidance:
<strong>${projectedRange}</strong>
`;

const weaknesses = [];

if(userAnswers.includes("Never studied"))
weaknesses.push("Limited Section 3 scientific foundation");

if(userAnswers.includes("No Experience"))
weaknesses.push("Limited essay-writing background");

if(userAnswers.includes("0"))
weaknesses.push("Low exposure to official ACER-style exams");

if(userAnswers.includes("No plan at all"))
weaknesses.push("Lack of structured study planning");

if(userAnswers.includes("Untimed or never practiced"))
weaknesses.push("Limited realistic Section 2 preparation");

if(userAnswers.includes("Just note the answer"))
weaknesses.push("Weak post-practice error analysis");

if(userAnswers.includes("Never"))
weaknesses.push("Insufficient timed practice conditions");

if(userAnswers.includes("Far from ready"))
weaknesses.push("Low confidence under exam conditions");

if(userAnswers.includes("Study when I can"))
weaknesses.push("Inconsistent study routine");

if(userAnswers.includes("Section 3"))
weaknesses.push("Section 3 reasoning and science application");

const weaknessList =
document.getElementById("weaknessList");

weaknessList.innerHTML = "";

const uniqueWeaknesses =
[...new Set(weaknesses)];

uniqueWeaknesses.slice(0,5).forEach(item=>{

const li =
document.createElement("li");

li.innerText = item;

weaknessList.appendChild(li);

});

}

</script>

</body>
</html>
